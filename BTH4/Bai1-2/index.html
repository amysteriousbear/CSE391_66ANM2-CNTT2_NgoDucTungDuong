<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Điểm Sinh viên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>QUẢN LÝ ĐIỂM SINH VIÊN</h2>

        <div class="input-group">
            <input type="text" id="txtName" placeholder="Họ và tên" autocomplete="off">
            <input type="number" id="txtScore" placeholder="Điểm (0-10)" step="0.1">
            <button id="btnAdd">Thêm Sinh Viên</button>
            <input type="text" id="searchName" placeholder="Tìm theo tên...">
    
            <select id="filterGrade">
                <option value="all">Tất cả xếp loại</option>
                <option value="Giỏi">Giỏi</option>
                <option value="Khá">Khá</option>
                <option value="Trung bình">Trung bình</option>
                <option value="Yếu">Yếu</option>
            </select>
        </div>
        

        <div class="table-container">
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Họ tên</th>
                        <th id="sortScore" style="cursor:pointer">Điểm <span id="sortIcon">↕</span></th>
                        <th>Xếp loại</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="studentBody">
                    </tbody>
            </table>
        </div>

        <div class="stats-bar">
            <div class="stat-item">Tổng số: <span id="totalStudents">0</span></div>
            <div class="stat-item">Điểm trung bình: <span id="avgScore">0.00</span></div>
        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
