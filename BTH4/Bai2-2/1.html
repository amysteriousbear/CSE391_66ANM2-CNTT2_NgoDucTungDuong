<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Đặt hàng Trực tuyến</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <form id="order-form">
            <h2>ĐƠN ĐẶT HÀNG</h2>

            <div class="form-group">
                <label for="product">Sản phẩm:</label>
                <select id="product">
                    <option value="">-- Chọn sản phẩm --</option>
                    <option value="Laptop">Laptop (20.000.000đ)</option>
                    <option value="Smartphone">Smartphone (10.000.000đ)</option>
                    <option value="Keyboard">Bàn phím (1.500.000đ)</option>
                </select>
                <span class="error" id="err-product"></span>
            </div>

            <div class="form-group">
                <label for="quantity">Số lượng (1-99):</label>
                <input type="number" id="quantity" placeholder="Nhập số lượng">
                <span class="error" id="err-quantity"></span>
                <div class="total-display">
                    <strong>Tổng tiền dự kiến: <span id="total-price">0</span> VNĐ</strong>
                </div>
            </div>

            <div class="form-group">
                <label for="delivery-date">Ngày giao hàng:</label>
                <input type="date" id="delivery-date">
                <span class="error" id="err-delivery-date"></span>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ nhận hàng (≥ 10 ký tự):</label>
                <textarea id="address" rows="2" placeholder="Số nhà, tên đường, phường/xã..."></textarea>
                <span class="error" id="err-address"></span>
            </div>

            <div class="form-group">
                <label for="note">Ghi chú (Tối đa 200 ký tự):</label>
                <textarea id="note" rows="3" placeholder="Yêu cầu đặc biệt..."></textarea>
                <div id="char-count">0/200</div>
                <span class="error" id="err-note"></span>
            </div>

            <div class="form-group">
                <label>Phương thức thanh toán:</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio
